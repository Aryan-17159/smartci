name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        id: install
        run: python -m pip install -r requirements.lock
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: .smartci/build-cache
          key: build-${{ runner.os }}-py312-${{ hashFiles('requirements.lock', 'scripts/cache_build.py', 'scripts/dependencies.py') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            build-${{ runner.os }}-py312-${{ hashFiles('requirements.lock', 'scripts/cache_build.py', 'scripts/dependencies.py') }}-
      - name: Build with dependency-aware invalidation
        run: python -m scripts.cache_build --output reports/cache.json
      - name: Run dynamically selected tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m scripts.select_tests --base "$BASE_SHA" --head HEAD --merge-base --run
      - name: Full test suite safety check
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v --junitxml=reports/full-tests.xml 2>&1 | tee build.log
      - name: Reproduce cache and routing experiments
        run: python -m scripts.demo_assignments
      - name: Train and evaluate educational failure predictor
        run: |
          python -m ml.predict_failure train
          python -m ml.predict_failure predict --features ml/example_features.json
      - name: Extract exact log facts
        if: always() && steps.install.outcome == 'success'
        run: python -m scripts.summarize_log build.log --provider extractive
      - name: Install local LLM for manual demonstration
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-llm.txt
      - name: Summarize known failure using local LLM
        if: github.event_name == 'workflow_dispatch'
        run: python -m scripts.summarize_log docs/evidence/github-red-run.txt --provider local-llm --revision 0fc9ddf78a1e988dac52e2dac162b0ede4fd74ab --output reports/llm-summary.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smartci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            build.log
          retention-days: 30
          if-no-files-found: warn
